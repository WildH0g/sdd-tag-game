<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM-Arena | Phase 2 Diagnostic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-200 font-sans min-h-screen flex flex-col items-center justify-center">

    <!-- Diagnostic HUD -->
    <div id="hud" class="fixed top-4 left-4 bg-slate-900/80 border border-slate-700 p-4 rounded-md font-mono text-xs shadow-xl backdrop-blur-sm z-50">
        <div class="flex flex-col gap-1">
            <div><span class="text-slate-500">CLIENT_ID:</span> <span id="metric-id" class="text-blue-400">---</span></div>
            <div><span class="text-slate-500">SERVER_TICK:</span> <span id="metric-tick" class="text-emerald-400">0</span></div>
            <div><span class="text-slate-500">LATENCY:</span> <span id="metric-latency" class="text-yellow-400">0ms</span></div>
            <div><span class="text-slate-500">ENTITIES:</span> <span id="metric-entities" class="text-purple-400">0</span></div>
        </div>
    </div>

    <h1 class="mb-6 text-2xl font-bold tracking-tight text-slate-400 uppercase">Phase 2: Input Sampling</h1>

    <!-- Game Arena (800x600) -->
    <div id="arena" class="relative w-[800px] h-[600px] bg-slate-900 border-4 border-slate-800 rounded-lg shadow-2xl overflow-hidden cursor-crosshair">
        <!-- Players will be injected here -->
    </div>

    <p class="mt-6 text-slate-500 text-sm max-w-lg text-center leading-relaxed">
        InputManager is active. Movement vectors are polled at 20Hz.<br>
        <span class="text-emerald-400 font-bold">Use Arrow Keys to move.</span>
    </p>

    <script type="module">
        import { InputManager } from './src/client/InputManager.js';

        const arena = document.getElementById('arena');
        const metricId = document.getElementById('metric-id');
        const metricTick = document.getElementById('metric-tick');
        const metricLatency = document.getElementById('metric-latency');
        const metricEntities = document.getElementById('metric-entities');

        const playerElements = new Map();
        let myClientId = null;

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        // Instantiate InputManager
        const inputManager = new InputManager({
            onInputPolled: (inputRecord) => {
                // Only send and log if there is an active connection
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify(inputRecord));

                    // Diagnostic: Log outgoing movement vectors
                    const [type, seq, vx, vy] = inputRecord;
                    if (vx !== 0 || vy !== 0) {
                        console.log('%cMovement Sent:', 'color: #3b82f6; font-weight: bold;', inputRecord);
                    }
                }
            }
        });

        ws.onopen = () => {
            console.log('%cConnected to DOM-Arena Authority', 'color: #10b981; font-weight: bold;');
            inputManager.start();
        };

        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            
            if (data[0] === 0) {
                myClientId = data[1];
                metricId.innerText = myClientId.split('-')[0] + '...';
                return;
            }

            const [seq, serverTime, players] = data;
            
            metricTick.innerText = seq;
            metricEntities.innerText = players.length;
            const latency = Math.floor(performance.now() - (window.lastTickTime || performance.now()));
            metricLatency.innerText = `${latency}ms`;
            window.lastTickTime = performance.now();

            reconcilePlayers(players);
        };

        function reconcilePlayers(snapshot) {
            const currentIds = new Set(snapshot.map(p => p[0]));

            for (const [id, el] of playerElements.entries()) {
                if (!currentIds.has(id)) {
                    el.remove();
                    playerElements.delete(id);
                }
            }

            for (const [id, x, y, lastSeq] of snapshot) {
                let el = playerElements.get(id);

                if (!el) {
                    el = document.createElement('div');
                    el.className = 'absolute w-6 h-6 rounded shadow-lg transition-colors duration-200';
                    el.style.backgroundColor = id === myClientId ? '#3b82f6' : '#94a3b8';
                    el.innerHTML = `<div class="absolute -top-6 left-1/2 -translate-x-1/2 text-[10px] font-mono text-slate-500 whitespace-nowrap">${id.split('-')[0]}</div>`;
                    arena.appendChild(el);
                    playerElements.set(id, el);
                }

                // Still using snapping for now (Phase 3 will add Lerp)
                el.style.transform = `translate(${x - 12}px, ${y - 12}px)`;
            }
        }

        ws.onclose = () => {
            console.warn('Disconnected from Server');
            inputManager.stop();
            document.body.classList.add('grayscale', 'opacity-50');
        };

        window.ws = ws;
        window.inputManager = inputManager;
    </script>
</body>
</html>
