<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM-Arena | Phase 2 Movement</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-200 font-sans min-h-screen flex flex-col items-center justify-center">

    <!-- Diagnostic HUD -->
    <div id="hud" class="fixed top-4 left-4 w-48 bg-slate-900/80 border border-slate-700 p-4 rounded-md font-mono text-xs shadow-xl backdrop-blur-sm z-50">
        <div class="flex flex-col gap-1">
            <div><span class="text-slate-500">CLIENT_ID:</span> <span id="metric-id" class="text-blue-400">---</span></div>
            <div><span class="text-slate-500">SERVER_TICK:</span> <span id="metric-tick" class="text-emerald-400">0</span></div>
            <div><span class="text-slate-500">LATENCY:</span> <span id="metric-latency" class="text-yellow-400">0ms</span></div>
            <div><span class="text-slate-500">ENTITIES:</span> <span id="metric-entities" class="text-purple-400">0</span></div>
            <hr class="border-slate-800 my-1">
            <div class="text-[10px] text-slate-500 uppercase font-bold mb-1">Scoreboard</div>
            <div id="scoreboard" class="flex flex-col gap-1 max-h-32 overflow-y-auto pr-2 mb-2">
                <!-- Scores injected here -->
            </div>
            <hr class="border-slate-800 my-1">
            <div class="text-[10px] text-slate-500 uppercase font-bold mb-1">Phase 2 Metrics</div>
            <div><span class="text-slate-500">MODE:</span> <span class="text-blue-400">PREDICTION + LERP</span></div>
            <div><span class="text-slate-500">BUF_DEPTH:</span> <span id="metric-buffer" class="text-cyan-400">0</span></div>
        </div>
    </div>

    <h1 class="mb-6 text-2xl font-bold tracking-tight text-slate-400 uppercase">Phase 2: Fluid Movement</h1>

    <!-- Game Arena (800x600) -->
    <div id="arena" class="relative w-[800px] h-[600px] bg-slate-900 border-4 border-slate-800 rounded-lg shadow-2xl overflow-hidden cursor-crosshair">
        <!-- Players injected by ClientEngine -->
    </div>

    <p class="mt-6 text-slate-500 text-sm max-w-lg text-center leading-relaxed">
        Movement is now decoupled from network rate.<br>
        <span class="text-blue-400 font-bold">Local Prediction</span> provides instant response.<br>
        <span class="text-slate-400 font-bold">Snapshot Interpolation</span> smooths remote players.
    </p>

    <script type="module">
        import { InputManager } from './src/client/InputManager.js';
        import { InterpolationBuffer } from './src/client/InterpolationBuffer.js';
        import { ClientEngine } from './src/client/ClientEngine.js';
        import { applyInput } from './src/shared/physics.js';

        const arena = document.getElementById('arena');
        const metricId = document.getElementById('metric-id');
        const metricTick = document.getElementById('metric-tick');
        const metricLatency = document.getElementById('metric-latency');
        const metricEntities = document.getElementById('metric-entities');
        const metricBuffer = document.getElementById('metric-buffer');

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        // 1. Initialize Components
        const inputManager = new InputManager({
            onInputPolled: (input) => {
                if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(input));
            }
        });

        const interpolationBuffer = new InterpolationBuffer({
            maxBufferSize: 100,
            pruneThresholdMs: 500
        });

        const engine = new ClientEngine({
            arenaElement: arena,
            inputManager,
            interpolationBuffer,
            sharedPhysics: { applyInput },
            renderDelayMs: 100, // 2-tick buffer
            snapThreshold: 50
        });

        // 2. Wire WebSocket events
        ws.onopen = () => {
            console.log('%cConnected to DOM-Arena Authority', 'color: #10b981; font-weight: bold;');
            inputManager.start();
            engine.start();
        };

        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            
            // Handshake
            if (data[0] === 0) {
                const myId = data[1];
                const serverTime = data[2];
                engine.setMyClientId(myId);
                engine.syncClock(serverTime);
                metricId.innerText = myId.split('-')[0] + '...';
                return;
            }

            // Heartbeat
            const [seq, serverTime, players] = data;
            
            metricTick.innerText = seq;
            metricEntities.innerText = players.length;
            metricBuffer.innerText = interpolationBuffer.buffer.length;

            const latency = Math.floor(performance.now() - (window.lastTickTime || performance.now()));
            metricLatency.innerText = `${latency}ms`;
            window.lastTickTime = performance.now();

            interpolationBuffer.push(data);
            interpolationBuffer.prune(serverTime);
            engine.onSnapshotReceived(data);
            reconcileRoles(players);
        };

        /**
         * Authoritative role-based rendering reconciliation.
         */
        function reconcileRoles(snapshot) {
            const myClientId = engine.myClientId;
            const scoreboard = document.getElementById('scoreboard');
            
            // Sort players by score for the HUD list
            const sortedPlayers = [...snapshot].sort((a, b) => b[5] - a[5]);
            scoreboard.innerHTML = sortedPlayers.map(p => {
                const isMe = p[0] === myClientId;
                const id = p[0].split('-')[0];
                const score = p[5];
                return `<div class="flex justify-between w-full gap-2 ${isMe ? 'text-blue-400 font-bold' : 'text-slate-400'}">
                    <span class="inline-block truncate w-24">${id}</span>&nbsp;
                    <span class="font-mono shrink-0">${score}</span>
                </div>`;
            }).join('');

            for (const [id, x, y, lastSeq, role, score] of snapshot) {
                const el = engine.playerElements.get(id);
                if (!el) continue;

                const isHunter = 1 === role;
                const baseColor = isHunter ? '#ef4444' : (id === myClientId ? '#3b82f6' : '#94a3b8');
                
                el.style.backgroundColor = baseColor;
                el.style.boxShadow = isHunter ? '0 0 15px rgba(239, 68, 68, 0.5)' : 'none';
                el.innerHTML = `<div class="absolute -top-6 left-1/2 -translate-x-1/2 text-[10px] font-mono text-slate-500 whitespace-nowrap">${id.split('-')[0]} [${score}]</div>`;
            }
        }

        ws.onclose = () => {
            console.warn('Disconnected from Server');
            inputManager.stop();
            engine.stop();
            document.body.classList.add('grayscale', 'opacity-50');
        };

        // Exposed for manual testing
        window.ws = ws;
        window.engine = engine;
    </script>
</body>
</html>
