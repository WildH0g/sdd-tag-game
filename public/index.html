<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOM-Arena Phase 1 Diagnostic</title>
</head>
<body>
    <h1>Phase 1 Diagnostic Console</h1>
    <p>Open the browser console (F12) to see the WebSocket handshake.</p>
    <script>
        const ws = new WebSocket(`ws://${window.location.host}`);
        ws.onopen = () => console.log('Connected to Server');
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            console.log('Message Received:', data);
            if (data[0] === 0) {
                console.log('%cHandshake Successful! Client ID: ' + data[1], 'color: green; font-weight: bold;');
            }
        };
        ws.onclose = () => console.log('Disconnected from Server');
        ws.onerror = (err) => console.error('WebSocket Error:', err);
    </script>
</body>
</html>
